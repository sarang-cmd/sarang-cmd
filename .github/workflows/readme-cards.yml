name: Refresh README cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contribution calendar
        run: python scripts/fetch_contributions.py sarang-cmd
      - name: Render README cards (hero, graph, chart, tiles, repos, stack)
        run: python scripts/render_readme_cards.py
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --staged --quiet || git commit -m "Refresh README cards"
          git push
